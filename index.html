<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Schweizer Scheidungsrecht RAG-System mit Claude AI - Durchsuche und analysiere Urteile zum Scheidungsrecht" />
    <meta name="keywords" content="Scheidungsrecht, Schweiz, RAG, Claude, AI, Urteile, Bundesgericht" />
    <meta name="author" content="Scheidungsrecht-RAG Team" />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Scheidungsrecht-DB 🇨🇭" />
    <meta property="og:description" content="Schweizer Scheidungsurteile durchsuchen und analysieren mit KI" />

    <title>Scheidungsrecht-DB 🇨🇭 | RAG-System</title>

    <style>
      /* Loading screen */
      #loading-screen {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #1e293b 0%, #7f1d1d 50%, #1e293b 100%);
        z-index: 9999;
        transition: opacity 0.3s ease-out;
      }

      #loading-screen.fade-out {
        opacity: 0;
        pointer-events: none;
      }

      .loader {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(239, 68, 68, 0.3);
        border-top-color: #ef4444;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <!-- Loading Screen -->
    <div id="loading-screen">
      <div class="loader"></div>
    </div>

    <!-- React Root -->
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>

    <script>
      // Hide loading screen when app is ready
      window.addEventListener('load', () => {
        const loader = document.getElementById('loading-screen');
        if (loader) {
          loader.classList.add('fade-out');
          setTimeout(() => loader.remove(), 300);
        }
      });

      // Service Worker registration (optional, for PWA)
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // Uncomment to enable service worker
          // navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
